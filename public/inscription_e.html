<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Entreprise - Gestionnaire de Stage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; padding: 40px 0; }
        .signup-container { max-width: 650px; margin: auto; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header-logo { font-size: 0.9rem; color: #6c757d; margin-bottom: 30px; }
        h2 { font-weight: 700; text-align: center; margin-bottom: 35px; }
        .form-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #333; }
        .form-control, .form-select { background-color: #f0f2f5; border: none; border-radius: 8px; padding: 10px 15px; }
        .form-control:focus, .form-select:focus { background-color: #e9ecef; box-shadow: none; border: 1px solid #ced4da; }
        .section-title { font-size: 1rem; font-weight: 700; margin: 25px 0 15px 0; padding-bottom: 5px; border-bottom: 2px solid #f0f2f5; }
        .upload-box { background-color: #f8f9fa; border: 2px dashed #ccd0d5; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .upload-box:hover { background-color: #f0f2f5; }
        .btn-submit { background-color: #000; color: white; border: none; border-radius: 8px; padding: 14px; width: 100%; margin-top: 30px; font-weight: 600; }
        .btn-submit:hover { background-color: #333; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="signup-container">
        

        <h2>Inscription Entreprise</h2>

        <form>
            <div class="section-title">Informations Générales</div>
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Nom de l'Entreprise</label>
                    <input type="text" class="form-control" placeholder="Ex: Tech Solutions SAS" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Numéro SIRET</label>
                    <input type="text" class="form-control" placeholder="123 456 789 00012" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Secteur d'Activité</label>
                    <select class="form-select">
                        <option selected>Sélectionner...</option>
                        <option>Informatique / Digital</option>
                        <option>Communication / Marketing</option>
                        <option>Finance / Banque</option>
                        <option>Ingénierie / Industrie</option>
                    </select>
                </div>
            </div>

            <div class="section-title">Contact & Siège</div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">E-mail Professionnel</label>
                    <input type="email" class="form-control" placeholder="contact@entreprise.com" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Numéro de Téléphone</label>
                    <input type="tel" class="form-control" placeholder="01 00 00 00 00">
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Lieu du Siège</label>
                    <input type="text" class="form-control" placeholder="Ex: Lyon, France">
                </div>
            </div>

            <div class="section-title">Documents & Identité</div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Logo de l'Entreprise (JPG/PNG)</label>
                    <div class="upload-box">
                        <input type="file" class="form-control d-none" id="logoUpload" accept="image/*">
                        <label for="logoUpload" style="cursor: pointer;">
                            <small class="text-muted">Téléverser le Logo</small>
                        </label>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Plaquette / Présentation (PDF)</label>
                    <div class="upload-box">
                        <input type="file" class="form-control d-none" id="pdfUpload" accept=".pdf">
                        <label for="pdfUpload" style="cursor: pointer;">
                            <small class="text-muted">Téléverser la Plaquette</small>
                        </label>
                    </div>
                </div>
            </div>

            <div class="section-title">Sécurité</div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" class="form-control" placeholder="********" required>
            </div>

            <button type="submit" class="btn btn-submit" onclick="window.location.href='profil_e.html'">Enregistrer le profil Entreprise</button>
        </form>
    </div>
</div>

</body>
</html>
