<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Étudiant - Gestionnaire de Stage</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 0;
        }

        .signup-container {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header-logo {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 30px;
        }

        h2 {
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .form-control,
        .form-select {
            background-color: #f0f2f5;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.95rem;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #e9ecef;
            box-shadow: none;
            border: 1px solid #ced4da;
        }

        /* Style spécial pour le champ de téléchargement (CV) */
        .file-upload-wrapper {
            background-color: #f0f2f5;
            border: 2px dashed #ccd0d5;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }

        .btn-submit {
            background-color: #000;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            margin-top: 30px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="signup-container">
            <!-- Header -->


            <h2>Inscription Étudiant</h2>

            <form action="/etudiant-inscription" method="POST">
                <!-- Nom complet -->
                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input type="text" name="nom_etudiant" class="form-control" placeholder="Ex: Dupont" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Prénom</label>
                    <input type="text" name="prenom_etudiant" class="form-control" placeholder="Ex: Jean" required>
                </div>

                <!-- Email Universitaire -->
                <div class="mb-3">
                    <label class="form-label">E-mail Universitaire</label>
                    <input type="email" name="email_academique" class="form-control" placeholder="jean.dupont@univ-exemple.fr" required>
                </div>

                <div class="row">
                    <!-- Téléphone -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Téléphone</label>
                        <input type="tel" name="num_telephone" class="form-control" placeholder="06 00 00 00 00">
                    </div>
                    <!-- Année d'étude -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Année d'étude</label>
                        <select name="année_etude" class="form-select">
                            <option selected>Choisir...</option>
                            <option value="0">Baccalaureat</option>
                            <option value="2"> Bac + 2 (BTS)</option>
                            <option value="3">Bac + 3 (BUT/Licence/Bachelor)</option>
                            <option value="5">Bac + 5 (Master)</option>


                        </select>
                    </div>
                </div>

                <!-- Formation -->
                <div class="mb-3">
                    <label class="form-label">Formation / Spécialité</label>
                    <input type="text" name="formation_etudiant" class="form-control" placeholder="Ex: Développement Web, Marketing...">
                </div>

                <!-- Mot de passe -->
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="mdp_etudiant" class="form-control" placeholder="********" required>
                </div>


                <!-- Bouton Submit -->  

                <button type="submit" class="btn-submit">Enregistrer</button>
            </form>
        </div>
    </div>

</body>

</html>
