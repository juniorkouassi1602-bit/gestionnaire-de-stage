    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        .choice-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;

            border-radius: 20px;

            color: #6c757d;
            margin-bottom: 50px;
        }

            margin-bottom: 40px;
            text-align: center;
        }
        .btn-choice {
            background-color: #000;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
        }
        .btn-choice:hover {
            background-color: #333;
            color: white;
            transform: translateY(-2px);
        }
        .btn-choice svg {
            margin-right: 12px;
        }
