<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postuler - Gestionnaire de Stage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; padding: 40px 0; }
        .postuler-container {
            max-width: 600px; margin: auto; background: white;
            border-radius: 20px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .header-logo { font-size: 0.85rem; color: #6c757d; margin-bottom: 25px; }
        h2 { font-weight: 700; font-size: 1.5rem; margin-bottom: 30px; text-align: center; }
        
        .form-label { font-size: 0.8rem; font-weight: 700; color: #333; margin-bottom: 5px; }
        .form-control { background-color: #f0f2f5; border: none; border-radius: 8px; padding: 10px 15px; font-size: 0.9rem; }
        
        /* Zone de téléchargement style maquette */
        .upload-row {
            display: flex; align-items: center; background-color: #f0f2f5;
            padding: 10px 15px; border-radius: 8px; margin-bottom: 15px;
        }
        .upload-text { font-size: 0.85rem; flex-grow: 1; color: #495057; }
        .btn-upload-action { 
            background: white; border: 1px solid #dee2e6; border-radius: 6px;
            padding: 4px 12px; font-size: 0.8rem; font-weight: 600; color: #000;
        }

        .btn-submit-app {
            background-color: #000; color: white; border: none;
            border-radius: 10px; padding: 14px; width: 100%;
            font-weight: 700; margin-top: 20px;
        }
        .btn-cancel {
            display: block; text-align: center; color: #6c757d;
            font-size: 0.85rem; margin-top: 15px; text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="postuler-container">
        <!-- Header -->
       

        <h2>Postuler à l'offre : </h2>
        <h2>[Nom de l'offre]</h2>

        <form>
            <div class="mb-3">
                <label class="form-label">Nom Complet</label>
                <input type="text" class="form-control" placeholder="Nom Complet" ">
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail professionnel</label>
                <input type="email" class="form-control" placeholder="Email professionnel" >
            </div>

            <div class="mb-3">
                <label class="form-label">Numéro de téléphone</label>
                <input type="tel" class="form-control" placeholder="06..." >
            </div>

            <!-- Téléverser CV conforme à la maquette -->
            <label class="form-label">Téléverser votre CV (PDF)*</label>
            <div class="upload-row">
                <div class="upload-text">📄 Téléverser mon CV (PDF)</div>
                <button type="button" class="btn-upload-action">Téléverser</button>
            </div>

            

            <div class="mb-3">
                <label class="form-label">Ajouter un message...</label>
                <textarea class="form-control" rows="4" placeholder="Votre message à l'attention du recruteur..."></textarea>
            </div>

            <button type="submit" class="btn-submit-app">Envoyer ma candidature</button>
            <a href="#" class="btn-cancel" onclick="window.history.back()">Annuler</a>
        </form>
    </div>
</div>

</body>
</html>
