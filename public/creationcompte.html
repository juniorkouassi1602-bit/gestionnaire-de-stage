<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestionnaire de Stage</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header-logo {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 40px;
        }
        h2 {
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-control {
            background-color: #f0f2f5;
            border: none;
            border-radius: 8px;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #e9ecef;
            box-shadow: none;
            border: 1px solid #ced4da;
        }
        .forgot-password {
            font-size: 0.75rem;
            text-align: right;
            display: block;
            margin-top: 5px;
            color: #000;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-login {
            background-color: #000;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            margin-top: 25px;
            font-weight: 600;
        }
        .btn-login:hover {
            background-color: #333;
            color: white;
        }
        .create-account {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #6c757d;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="login-container">
        <!-- Logo / Titre du haut -->
        

        <h2>Connexion</h2>

        <form>
            <!-- Champ Email -->
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="Email">
            </div>

            <!-- Champ Mot de passe -->
            <div class="mb-1">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" placeholder="Mot de passe">
            </div>

            <!-- Mot de passe oublié -->
            <a href="#" class="forgot-password">Mot de passe oublié ?</a>

            <!-- Bouton de connexion -->
            <button type="submit" class="btn btn-login">Se connecter</button>
        </form>

        <!-- Créer un compte -->
        <a href="choix.html" class="create-account">Créer un compte</a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
